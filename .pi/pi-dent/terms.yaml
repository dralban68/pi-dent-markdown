    group: Links
    key: local
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: leading-component
    label: leading component
    meaning: A component of a heading number other than its last.
    owner: specs/markdown-tool.md
    group: Renumbering
    key: local
    status: active
    distinguish:
      - component
    history:
      - date: 2026-11-26
        op: add
      - date: 2026-11-26
        op: update
  - id: line-count
    label: line count
    meaning: "The number of lines of a file's text, 0 for an empty text."
