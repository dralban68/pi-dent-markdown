    group: Section addresses
    key: local
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: group
    label: group
    meaning: "The subsections of one section, or the top-level sections, as renumbering numbers them."
    owner: specs/markdown-tool.md
    group: Renumbering
    key: local
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: heading
    label: heading
