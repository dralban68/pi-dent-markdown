    group: pi-dent-agent
    key: confusable
    status: active
    forms:
      - flattened
    history:
      - date: 2026-11-26
        op: add
  - id: frontmatter
    label: frontmatter
    meaning: The block of keys and values at the top of a Markdown resource file
    owner: "../pi-dent-agent/specs/skill.md"
    group: pi-dent-agent
    key: confusable
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: full-address
    label: full address
    meaning: "The components of a section's ancestors and its own, joined by the separator."
