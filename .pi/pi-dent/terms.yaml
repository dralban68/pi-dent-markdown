    group: Documents
    key: local
    status: active
    distinguish:
      - id-component
    history:
      - date: 2026-11-26
        op: add
      - date: 2026-11-26
        op: update
  - id: id-component
    label: id component
    meaning: "An address component that is # followed by an id, which names the section whose heading's id attribute holds it."
