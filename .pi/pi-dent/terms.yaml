    group: Section addresses
    key: local
    status: active
    distinguish:
      - number-component
      - leading-component
    history:
      - date: 2026-11-26
        op: add
      - date: 2026-11-26
        op: update
  - id: content-block
    label: content block
    meaning: "The lines of an operation's content without leading and trailing blank lines."
    owner: specs/markdown-tool.md
    group: Edit
    key: local
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: cut-line
    label: cut line
    meaning: "The closing line of a read that stopped before its range's end, naming the offset to continue with."
