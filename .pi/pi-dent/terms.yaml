    group: Documents
    key: shared
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: host
    label: host
    meaning: The pi process and extension API pi-dent runs in
    owner: "../pi-dent-agent/specs/config-file.md"
    group: pi-dent-agent
    key: confusable
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: id-attribute
    label: id attribute
    meaning: "A trailing {#<id>} of a heading's text, after a space or tab, that addresses can omit and that rename keeps."
