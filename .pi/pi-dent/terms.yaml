    group: Edit
    key: confusable
    status: active
    distinguish:
      - link-destination
    history:
      - date: 2026-11-26
        op: add
      - date: 2026-11-26
        op: update
  - id: destination-level
    label: destination level
    meaning: The level that fitting gives the first heading an insert or move places.
    owner: specs/markdown-tool.md
    group: Edit
    key: local
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: display-line
    label: display line
    meaning: "A line of the read range, or a marker line standing for a collapsed section's further lines."
