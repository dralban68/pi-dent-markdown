    group: Section addresses
    key: shared
    status: active
    history:
      - date: 2026-11-26
        op: add
      - date: 2026-11-26
        op: update
        meaning: "A leading <a>-<b> in an address, which restricts it to the section whose reference span is those lines."
  - id: link-destination
    label: link destination
    meaning: "The URL or path a link or link reference definition points to, as CommonMark defines it."
