terms:
  - id: action
    label: action
    meaning: "What one Markdown call does: outline, read, edit, or links."
    owner: specs/markdown-tool.md
    group: Markdown tool
    key: shared
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: affected-group
    label: affected group
    meaning: "A group whose members or parent an operation changed, or whose parent's number its renumbering changed."
    owner: specs/markdown-tool.md
    group: Renumbering
    key: local
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: argument-preparation
    label: argument preparation
    meaning: "The repair, before the host validates a call, of an operations argument sent as a JSON string or a lone object."
    owner: specs/markdown-tool.md
    group: Markdown tool
    key: local
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: atx-heading
    label: ATX heading
    meaning: "A heading opened by one to six # characters, as CommonMark defines it."
    owner: specs/markdown-tool.md
    group: Documents
    key: local
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: auto-numbered-heading
    label: auto-numbered heading
    meaning: "An unnumbered heading an operation places into a renumbered group, which takes a number there."
    owner: specs/markdown-tool.md
    group: Renumbering
    key: local
    status: active
    distinguish:
      - numbered-heading
    history:
      - date: 2026-11-26
        op: add
      - date: 2026-11-26
        op: update
  - id: base
    label: base
    meaning: "The numbered members of an affected group before the operation, with their numbers then."
    owner: specs/markdown-tool.md
    group: Renumbering
    key: local
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: blank-line
    label: blank line
    meaning: "A line holding only spaces and tabs, or nothing."
    owner: specs/markdown-tool.md
    group: Documents
    key: local
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: block-parsed-alone
    label: block parsed alone
    meaning: "A content block parsed by itself as a document, with no frontmatter recognized."
    owner: specs/markdown-tool.md
    group: Edit
    key: local
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: child-session
    label: child session
    meaning: The isolated in-process session one dispatch runs in
    owner: "../pi-dent-agent/specs/agent-tool.md"
    group: pi-dent-agent
    key: confusable
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: collapsed-section
    label: collapsed section
    meaning: "A descendant of the read section deeper than depth, none of whose ancestors below that section is collapsed."
