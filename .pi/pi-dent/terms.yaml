    group: Documents
    key: shared
    status: active
    distinguish:
      - section
    history:
      - date: 2026-11-26
        op: add
      - date: 2026-11-26
        op: update
  - id: heading-level
    label: heading level
    meaning: "A heading's level: the length of an ATX heading's opening sequence, or 1 or 2 for a setext heading."
    owner: specs/markdown-tool.md
    group: Documents
    key: local
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: heading-line
    label: heading line
    meaning: The first line of a heading.
    owner: specs/markdown-tool.md
    group: Documents
    key: local
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: heading-text
    label: heading text
    meaning: "An ATX heading's raw contents as written, or a setext heading's content lines joined by one space."
