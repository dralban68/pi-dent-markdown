    group: Documents
    key: confusable
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: end-line
    label: end line
    meaning: "A section's last non-blank line before the next heading of its level or higher, or before the end of the text."
    owner: specs/markdown-tool.md
    group: Sections
    key: local
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: entry-line
    label: entry line
    meaning: "An outline entry's text line: its span, heading marks, component, and hidden count."
    owner: specs/markdown-tool.md
    group: Outline and read
    key: local
    status: active
    distinguish:
      - outline-entry
    history:
      - date: 2026-11-26
        op: add
      - date: 2026-11-26
        op: update
  - id: file-mutation-queue
    label: file mutation queue
    meaning: "The host's per-file serialization of its edit and write tools, which an edit call holds from its read to its write."
    owner: specs/markdown-tool.md
    group: Edit
    key: local
    status: active
    history:
      - date: 2026-11-26
        op: add
  - id: fitting
    label: fitting
    meaning: "Shifting a block's heading levels by one difference so that its first heading takes a given level."
