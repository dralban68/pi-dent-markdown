    group: Section addresses
    key: local
    status: active
    distinguish:
      - id-attribute
    history:
      - date: 2026-11-26
        op: add
      - date: 2026-11-26
        op: update
  - id: item-line
    label: item line
    meaning: "A link item's text line: its line, kind, and destination, label, and text when it has them."
